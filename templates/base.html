<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Noticias Tech{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{% url 'noticias:lista' %}" class="brand">Noticias Tech</a>
      <nav class="nav">
        <a href="{% url 'noticias:lista' %}">Inicio</a>
        <a href="/admin/">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Demo Django + Render &mdash; Blog de noticias tecnologicas. Hecho con Django.</p>
    </div>
  </footer>
</body>
</html>
